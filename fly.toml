app = "اسم_البوت_بتاعك"  # غيّره لاسم مميز (حروف صغيرة وشرطات)

[build]
  dockerfile = "Dockerfile"

[env]
  BOT_TOKEN = "توكن_البوت_بتاعك"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
